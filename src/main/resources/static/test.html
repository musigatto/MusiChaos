<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MusiChaos - Lobby Client</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sockjs-client/1.6.1/sockjs.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/stomp.js/2.3.3/stomp.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
        }

        .card {
            background: white;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        h1, h2 {
            color: #333;
            margin-bottom: 16px;
        }

        h1 {
            color: white;
            text-align: center;
            margin-bottom: 24px;
            font-size: 2.5em;
            text-shadow: none;
        }

        .form-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            color: #555;
            font-weight: 500;
        }

        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: #e74c3c;
        }

        button {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-right: 8px;
        }

        button:hover {
            background: #c0392b;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .hidden {
            display: none;
        }

        .alert {
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 16px;
        }

        .alert-success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .lobby-info {
            background: #f8f9fa;
            padding: 16px;
            border-radius: 6px;
            margin-top: 16px;
        }

        .lobby-info p {
            margin: 8px 0;
            color: #333;
        }

        .lobby-info strong {
            color: #e74c3c;
        }

        .player-list {
            list-style: none;
            padding: 0;
        }

        .player-list li {
            background: white;
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 4px;
            border-left: 3px solid #e74c3c;
        }

        .scores-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 16px;
        }

        .scores-table th,
        .scores-table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #e0e0e0;
        }

        .scores-table th {
            background: #e74c3c;
            color: white;
            font-weight: 600;
        }

        .scores-table tr:hover {
            background: #f8f9fa;
        }

        .badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: 600;
        }

        .badge-success {
            background: #28a745;
            color: white;
        }

        .badge-warning {
            background: #ffc107;
            color: #333;
        }

        .ws-status {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .ws-connected {
            background: #28a745;
            color: white;
        }

        .ws-disconnected {
            background: #dc3545;
            color: white;
        }

        .message-log {
            max-height: 200px;
            overflow-y: auto;
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 12px;
        }

        .message-log p {
            margin: 4px 0;
            padding: 4px;
            border-left: 3px solid #e74c3c;
            padding-left: 8px;
        }
    </style>
</head>
<body>
<div class="ws-status ws-disconnected" id="wsStatus">● Desconectado</div>

<div class="container">
    <h1>🎵 MusiChaos</h1>

    <!-- Sección de Autenticación -->
    <div id="authSection" class="card">
        <h2>Autenticación</h2>
        <div id="authMessage"></div>

        <div class="form-group">
            <label>Email</label>
            <input type="email" id="authEmail" placeholder="tu@email.com">
        </div>

        <div class="form-group">
            <label>Username</label>
            <input type="text" id="authUsername" placeholder="Tu nombre de usuario">
        </div>

        <div class="form-group">
            <label>Password</label>
            <input type="password" id="authPassword" placeholder="Tu contraseña">
        </div>

        <button id="registerBtn">Registrarse</button>
        <button id="loginBtn">Iniciar Sesión</button>
    </div>

    <!-- Sección de Lobby (oculta hasta login) -->
    <div id="lobbySection" class="hidden">
        <div class="card">
            <h2>Gestión de Lobbies</h2>
            <button id="createLobbyBtn">🎮 Crear Nuevo Lobby</button>
            <button id="logoutBtn" style="background: #dc3545;">🚪 Cerrar Sesión</button>
        </div>

        <div class="card">
            <h2>Unirse a Lobby</h2>
            <div class="form-group">
                <label>Código del Lobby</label>
                <input type="text" id="joinCode" placeholder="Ej: ABCD1234">
            </div>
            <button id="joinLobbyBtn">👥 Unirse al Lobby</button>
        </div>

        <!-- Información del Lobby Actual -->
        <div id="currentLobbyCard" class="card hidden">
            <h2>Lobby Actual</h2>
            <div id="lobbyInfo" class="lobby-info"></div>
            <button id="loadScoresBtn" style="margin-top: 12px;">📊 Cargar Puntajes</button>
            <button id="leaveLobbyBtn" style="background: #dc3545; margin-top: 12px;">❌ Salir del Lobby</button>
        </div>

        <!-- Puntajes -->
        <div id="scoresCard" class="card hidden">
            <h2>Tabla de Puntajes</h2>
            <table class="scores-table" id="scoresTable">
                <thead>
                <tr>
                    <th>#</th>
                    <th>Jugador</th>
                    <th>Puntos</th>
                </tr>
                </thead>
                <tbody id="scoresBody"></tbody>
            </table>
        </div>

        <!-- Log de Mensajes WebSocket -->
        <div class="card">
            <h2>Mensajes en Tiempo Real</h2>
            <div class="message-log" id="messageLog">
                <p>Esperando conexión WebSocket...</p>
            </div>
        </div>
    </div>
</div>

<script>
    // Configuración
    const API_BASE = window.location.origin;
    const WS_URL = `${API_BASE}/ws`;

    // Estado global
    let token = localStorage.getItem('jwt_token');
    let currentLobby = null;
    let stompClient = null;
    let wsConnected = false;

    // Elementos del DOM
    const authSection = document.getElementById('authSection');
    const lobbySection = document.getElementById('lobbySection');
    const authMessage = document.getElementById('authMessage');
    const currentLobbyCard = document.getElementById('currentLobbyCard');
    const scoresCard = document.getElementById('scoresCard');
    const wsStatus = document.getElementById('wsStatus');
    const messageLog = document.getElementById('messageLog');

    // Inicialización
    if (token) {
        showLobbySection();
        connectWebSocket();
    }

    // ===================
    // FUNCIONES DE AUTH
    // ===================

    document.getElementById('registerBtn').addEventListener('click', async () => {
        const email = document.getElementById('authEmail').value;
        const username = document.getElementById('authUsername').value;
        const password = document.getElementById('authPassword').value;

        try {
            const response = await fetch(`${API_BASE}/api/auth/register`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, username, password })
            });

            if (response.ok) {
                showMessage('Registro exitoso. Ahora inicia sesión.', 'success');
            } else {
                const error = await response.text();
                showMessage(error, 'error');
            }
        } catch (err) {
            showMessage('Error de conexión: ' + err.message, 'error');
        }
    });

    document.getElementById('loginBtn').addEventListener('click', async () => {
        const email = document.getElementById('authEmail').value;
        const password = document.getElementById('authPassword').value;

        try {
            const response = await fetch(`${API_BASE}/api/auth/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            if (response.ok) {
                const data = await response.json();
                token = data.token;
                localStorage.setItem('jwt_token', token);
                showMessage('Login exitoso!', 'success');
                setTimeout(() => {
                    showLobbySection();
                    connectWebSocket();
                }, 1000);
            } else {
                showMessage('Credenciales inválidas', 'error');
            }
        } catch (err) {
            showMessage('Error de conexión: ' + err.message, 'error');
        }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
        localStorage.removeItem('jwt_token');
        token = null;
        currentLobby = null;
        if (stompClient) {
            stompClient.disconnect();
        }
        location.reload();
    });

    // ===================
    // FUNCIONES DE LOBBY
    // ===================

    document.getElementById('createLobbyBtn').addEventListener('click', async () => {
        try {
            const response = await fetch(`${API_BASE}/api/lobby/create`, {
                method: 'POST',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const lobby = await response.json();
                currentLobby = lobby;
                displayLobbyInfo(lobby);
                subscribeToLobby(lobby.id);
                addLogMessage(`✅ Lobby creado: ${lobby.code}`);
            } else {
                alert('Error creando lobby: ' + response.status);
            }
        } catch (err) {
            alert('Error: ' + err.message);
        }
    });

    document.getElementById('joinLobbyBtn').addEventListener('click', async () => {
        const code = document.getElementById('joinCode').value.trim();
        if (!code) {
            alert('Introduce un código válido');
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/api/lobby/join`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${token}`
                },
                body: JSON.stringify({ code })
            });

            if (response.ok) {
                const lobby = await response.json();
                currentLobby = lobby;
                displayLobbyInfo(lobby);
                subscribeToLobby(lobby.id);
                addLogMessage(`✅ Te uniste al lobby: ${lobby.code}`);
            } else {
                alert('Lobby no encontrado o error: ' + response.status);
            }
        } catch (err) {
            alert('Error: ' + err.message);
        }
    });

    document.getElementById('loadScoresBtn').addEventListener('click', async () => {
        if (!currentLobby) {
            alert('No estás en ningún lobby');
            return;
        }

        try {
            const response = await fetch(`${API_BASE}/api/lobby/${currentLobby.id}/scores`, {
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            if (response.ok) {
                const scores = await response.json();
                displayScores(scores);
                addLogMessage(`📊 Puntajes cargados (${scores.length} jugadores)`);
            } else {
                alert('Error cargando puntajes: ' + response.status);
            }
        } catch (err) {
            alert('Error: ' + err.message);
        }
    });

    document.getElementById('leaveLobbyBtn').addEventListener('click', () => {
        currentLobby = null;
        currentLobbyCard.classList.add('hidden');
        scoresCard.classList.add('hidden');
        addLogMessage('👋 Saliste del lobby');
    });

    // ===================
    // WEBSOCKET
    // ===================

    function connectWebSocket() {
        const socket = new SockJS(WS_URL);
        stompClient = Stomp.over(socket);

        stompClient.connect({}, (frame) => {
            wsConnected = true;
            updateWsStatus(true);
            addLogMessage('🟢 WebSocket conectado');

            // Suscribirse a actualizaciones generales
            stompClient.subscribe('/topic/lobby', (message) => {
                const data = JSON.parse(message.body);
                addLogMessage(`📨 Mensaje recibido: ${JSON.stringify(data)}`);

                // Si es información de un lobby, actualizarla
                if (data.id && currentLobby && data.id === currentLobby.id) {
                    currentLobby = data;
                    displayLobbyInfo(data);
                }
            });
        }, (error) => {
            wsConnected = false;
            updateWsStatus(false);
            addLogMessage('🔴 Error WebSocket: ' + error);
        });
    }

    function subscribeToLobby(lobbyId) {
        if (stompClient && wsConnected) {
            stompClient.subscribe(`/topic/lobby/${lobbyId}`, (message) => {
                const data = JSON.parse(message.body);
                addLogMessage(`📬 Lobby ${lobbyId}: ${JSON.stringify(data)}`);
            });
        }
    }

    function updateWsStatus(connected) {
        if (connected) {
            wsStatus.textContent = '● Conectado';
            wsStatus.className = 'ws-status ws-connected';
        } else {
            wsStatus.textContent = '● Desconectado';
            wsStatus.className = 'ws-status ws-disconnected';
        }
    }

    // ===================
    // UI HELPERS
    // ===================

    function showMessage(msg, type) {
        authMessage.innerHTML = `<div class="alert alert-${type}">${msg}</div>`;
        setTimeout(() => authMessage.innerHTML = '', 5000);
    }

    function showLobbySection() {
        authSection.classList.add('hidden');
        lobbySection.classList.remove('hidden');
    }

    function displayLobbyInfo(lobby) {
        currentLobbyCard.classList.remove('hidden');

        const playersHtml = lobby.players && lobby.players.length > 0
            ? `<ul class="player-list">${lobby.players.map(p => `<li>${p.username || p.email}</li>`).join('')}</ul>`
            : '<p>No hay jugadores aún</p>';

        const statusBadge = lobby.started
            ? '<span class="badge badge-success">En partida</span>'
            : '<span class="badge badge-warning">En espera</span>';

        document.getElementById('lobbyInfo').innerHTML = `
            <p><strong>ID:</strong> ${lobby.id}</p>
            <p><strong>Código:</strong> ${lobby.code}</p>
            <p><strong>Nombre:</strong> ${lobby.name}</p>
            <p><strong>Estado:</strong> ${statusBadge}</p>
            <p><strong>Jugadores (${lobby.players ? lobby.players.length : 0}):</strong></p>
            ${playersHtml}
        `;
    }

    function displayScores(scores) {
        scoresCard.classList.remove('hidden');
        const tbody = document.getElementById('scoresBody');

        if (scores.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" style="text-align: center;">No hay puntajes aún</td></tr>';
            return;
        }

        tbody.innerHTML = scores.map((score, index) => `
            <tr>
                <td>${index + 1}</td>
                <td>${score.username}</td>
                <td><strong>${score.points}</strong></td>
            </tr>
        `).join('');
    }

    function addLogMessage(msg) {
        const p = document.createElement('p');
        const timestamp = new Date().toLocaleTimeString();
        p.textContent = `[${timestamp}] ${msg}`;
        messageLog.appendChild(p);
        messageLog.scrollTop = messageLog.scrollHeight;
    }
</script>
</body>
</html>
